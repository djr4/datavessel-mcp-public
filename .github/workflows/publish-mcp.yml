name: Publish to MCP Registry

# Publishes server.json to the official MCP Registry on every push that changes
# it. Authentication uses GitHub Actions OIDC — no secrets or DNS records needed.
# The registry grants the io.github.djr4/* namespace to workflows in this repo.

on:
  push:
    branches: [main]
    paths: ['server.json']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # required for github-oidc login

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Build mcp-publisher
        run: |
          git clone --depth 1 https://github.com/modelcontextprotocol/registry /tmp/registry
          make -C /tmp/registry publisher
          cp /tmp/registry/bin/mcp-publisher .

      - name: Validate server.json
        run: ./mcp-publisher validate server.json

      - name: Login (GitHub OIDC) and publish
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
